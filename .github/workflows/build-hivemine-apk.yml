name: HiveMine Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find HiveMine ZIP
        shell: bash
        run: |
          ZIP=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -name "*.zip" \
            -print \
            -quit)

          if [ -z "$ZIP" ]; then
            echo "::error::No HiveMine ZIP found in repository root."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP"

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract HiveMine project
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/hivemine-project"
          mkdir -p "$GITHUB_WORKSPACE/hivemine-project"

          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/hivemine-project"

          echo "Extracted project:"
          find "$GITHUB_WORKSPACE/hivemine-project" \
            -maxdepth 4 \
            -type f | sort | head -200

      - name: Locate Gradle wrapper
        shell: bash
        run: |
          GRADLEW=$(find "$GITHUB_WORKSPACE/hivemine-project" \
            -type f \
            -name "gradlew" \
            -print \
            -quit)

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew was not found inside the ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Gradle wrapper:"
          echo "$GRADLEW"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK Manually
        shell: bash
        run: |
          # Create Android SDK directory structure
          export ANDROID_HOME="/opt/android-sdk"
          sudo mkdir -p "$ANDROID_HOME/cmdline-tools"
          sudo chmod -R 777 "$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          # Download and set up official Android command-line tools
          CD_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          curl -sSL "$CD_TOOLS_URL" -o "cmdline-tools.zip"
          unzip -q "cmdline-tools.zip" -d "temp-tools"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv temp-tools/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          rm -rf cmdline-tools.zip temp-tools

      - name: Accept Android SDK licenses and install packages
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android-36|build-tools;36.0.0" || true

      - name: Make Gradle executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Show Gradle version
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --version

      - name: Patch source compilation errors
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          
          # 1. Find MainActivity.java path dynamically
          MAIN_ACTIVITY=$(find . -type f -name "MainActivity.java" -print -quit)
          if [ -f "$MAIN_ACTIVITY" ]; then
            if ! grep -q "import android.widget.TextView;" "$MAIN_ACTIVITY"; then
              sed -i '/import android.widget.Button;/a import android.widget.TextView;' "$MAIN_ACTIVITY"
            fi
            
            # Fix ui.body parameter mismatch call
            sed -i 's/ui.body("Hands-free mode keeps listening for short natural phrases while the foreground voice service is active. Android shows a microphone privacy indicator and the service uses extra battery\.", Ui.MUTED, 10, false)/ui.body("Hands-free mode keeps listening for short natural phrases while the foreground voice service is active. Android shows a microphone privacy indicator and the service uses extra battery.")/g' "$MAIN_ACTIVITY"
          fi

          # 2. Fix missing ObservationFreshness import in MacroAccessibilityService.java
          MACRO_SERVICE=$(find . -type f -name "MacroAccessibilityService.java" -print -quit)
          if [ -f "$MACRO_SERVICE" ]; then
            if ! grep -q "import com.hiveminemobile.ai.control.ObservationFreshness;" "$MACRO_SERVICE"; then
              sed -i '/package com.hiveminemobile;/a import com.hiveminemobile.ai.control.ObservationFreshness;' "$MACRO_SERVICE"
            fi
          fi

          # 3. Cleanly add autoFarm field to Config.java right inside the class declaration
          CONFIG_FILE=$(find . -type f -name "Config.java" -print -quit)
          if [ -f "$CONFIG_FILE" ]; then
            sed -i '/public void save() {}/d' "$CONFIG_FILE"
            
            if ! grep -q "public boolean autoFarm;" "$CONFIG_FILE"; then
              sed -i '/class Config {/a \    public boolean autoFarm = false;' "$CONFIG_FILE"
            fi
          fi

      - name: Build HiveMine debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"
          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print

      - name: Upload HiveMine APK
        uses: actions/upload-artifact@v4
        with:
          name: HiveMine-Mobile-V1.0-debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 30
